name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version component to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Run releases from the main branch" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: Reject formatting drift
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt required:"
            echo "$files"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
      - run: make lint
      - name: Validate Helm chart
        run: |
          helm lint charts/tunlease
          helm template tunlease charts/tunlease >/dev/null

  tag:
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Calculate next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(git tag --list 'v*' --sort=-version:refname |
            grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' |
            head -n 1 || true)
          if [ -z "$latest" ]; then
            latest=v0.0.0
          fi
          IFS=. read -r major minor patch <<<"${latest#v}"
          case "$BUMP" in
            patch) patch=$((patch + 1));;
            minor) minor=$((minor + 1)); patch=0;;
            major) major=$((major + 1)); minor=0; patch=0;;
            *) echo "unsupported bump: $BUMP" >&2; exit 1;;
          esac
          version="v${major}.${minor}.${patch}"
          git rev-parse "$version" >/dev/null 2>&1 && {
            echo "$version already exists" >&2
            exit 1
          }
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Create verified release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "Logan"
          git config user.email "iml885203@gmail.com"
          git tag -a "$VERSION" -m "Tunlease $VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
          echo "Created $VERSION from $GITHUB_SHA" >>"$GITHUB_STEP_SUMMARY"

  publish-images:
    needs: tag
    permissions:
      # Reusable workflow permissions are validated for every nested job,
      # including the target-filtered release job.
      contents: write
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.tag.outputs.version }}
      ref: ${{ github.sha }}
      target: images
    secrets: inherit

  publish-release:
    needs: tag
    permissions:
      contents: write
      # Reusable workflow permissions are validated for every nested job,
      # including the target-filtered image job.
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.tag.outputs.version }}
      ref: ${{ github.sha }}
      target: release-cli
    secrets: inherit

  update-chart-defaults:
    needs: [tag, publish-images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Update Helm defaults to the released version
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          ./scripts/set-release-version.sh "$VERSION"
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/tunlease/Chart.yaml charts/tunlease/values.yaml
          git commit -m "chore(chart): update defaults to $VERSION"
          git push origin HEAD:main

  update-homebrew:
    needs: [tag, publish-release]
    uses: ./.github/workflows/sync-homebrew.yml
    with:
      version: ${{ needs.tag.outputs.version }}
    secrets:
      PACKAGE_SYNC_APP_PRIVATE_KEY: ${{ secrets.PACKAGE_SYNC_APP_PRIVATE_KEY }}

  update-scoop:
    needs: [tag, publish-release]
    uses: ./.github/workflows/sync-scoop.yml
    with:
      version: ${{ needs.tag.outputs.version }}
    secrets:
      PACKAGE_SYNC_APP_PRIVATE_KEY: ${{ secrets.PACKAGE_SYNC_APP_PRIVATE_KEY }}

  deploy-public-relay:
    needs: [tag, publish-images]
    uses: ./.github/workflows/deploy-public-relay.yml
    with:
      version: ${{ needs.tag.outputs.version }}
    secrets:
      PUBLIC_RELAY_INFRA_TOKEN: ${{ secrets.PUBLIC_RELAY_INFRA_TOKEN }}
