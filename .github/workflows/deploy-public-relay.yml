name: Deploy public relay

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      PUBLIC_RELAY_INFRA_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Existing stable release version to deploy
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s\n' "$VERSION" |
            grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "invalid stable release version: $VERSION" >&2
            exit 1
          fi
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Dispatch relay deployment and wait for completion
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELAY_INFRA_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          : "${GH_TOKEN:?set the PUBLIC_RELAY_INFRA_TOKEN repository secret}"
          previous_run_id=$(gh run list \
            --repo iml885203/tunlease-public-relay-infra \
            --workflow deploy.yml \
            --event workflow_dispatch \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          gh workflow run deploy.yml \
            --repo iml885203/tunlease-public-relay-infra \
            --ref main \
            -f version="$VERSION"

          for _ in $(seq 1 20); do
            run_id=$(
              gh run list \
                --repo iml885203/tunlease-public-relay-infra \
                --workflow deploy.yml \
                --event workflow_dispatch \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId'
            )
            [ -n "$run_id" ] && [ "$run_id" != "$previous_run_id" ] && break
            run_id=
            sleep 3
          done
          if [ -z "${run_id:-}" ]; then
            echo "public relay deployment did not start" >&2
            exit 1
          fi
          gh run watch "$run_id" \
            --repo iml885203/tunlease-public-relay-infra \
            --exit-status \
            --interval 5
          echo "Public relay deployed $VERSION in run $run_id" >>"$GITHUB_STEP_SUMMARY"
