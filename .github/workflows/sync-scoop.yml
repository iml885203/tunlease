name: Sync Scoop

on:
  workflow_call:
    inputs:
      version:
        description: Released semantic version tag
        required: true
        type: string
    secrets:
      PACKAGE_SYNC_APP_PRIVATE_KEY:
        description: Private key for the package-sync GitHub App
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Released semantic version tag to verify
        required: true
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Generate Scoop sync token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PACKAGE_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGE_SYNC_APP_PRIVATE_KEY }}
          owner: iml885203
          repositories: scoop-bucket
          permission-actions: write
          permission-contents: read
      - uses: ./.github/actions/sync-package-repository
        with:
          repository: iml885203/scoop-bucket
          token: ${{ steps.app-token.outputs.token }}
          version: ${{ inputs.version }}
      - name: Verify the manifest
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          manifest_version=$(gh api \
            repos/iml885203/scoop-bucket/contents/bucket/tunlease.json \
            --jq '.content' |
            base64 --decode |
            jq -r '.version')
          if [ "v$manifest_version" != "$VERSION" ]; then
            echo "Scoop manifest is v$manifest_version, expected $VERSION" >&2
            exit 1
          fi
          echo "Scoop manifest updated to $VERSION" >>"$GITHUB_STEP_SUMMARY"
