name: Sync Homebrew

on:
  workflow_call:
    inputs:
      version:
        description: Released semantic version tag
        required: true
        type: string
    secrets:
      PACKAGE_SYNC_APP_PRIVATE_KEY:
        description: Private key for the package-sync GitHub App
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Released semantic version tag to verify
        required: true
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Generate Homebrew sync token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PACKAGE_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGE_SYNC_APP_PRIVATE_KEY }}
          owner: iml885203
          repositories: homebrew-tap
          permission-actions: write
          permission-contents: read
      - uses: ./.github/actions/sync-package-repository
        with:
          repository: iml885203/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          version: ${{ inputs.version }}
      - name: Verify the formula
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          formula_version=$(gh api \
            repos/iml885203/homebrew-tap/contents/Formula/tunlease.rb \
            --jq '.content' |
            base64 --decode |
            sed -nE 's|.*tags/v([^/]+)\.tar\.gz.*|\1|p')
          if [ "v$formula_version" != "$VERSION" ]; then
            echo "Homebrew formula is v$formula_version, expected $VERSION" >&2
            exit 1
          fi
          echo "Homebrew formula updated to $VERSION" >>"$GITHUB_STEP_SUMMARY"
