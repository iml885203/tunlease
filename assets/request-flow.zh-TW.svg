        <text x="720" y="93" fill="#176b87" font-size="8" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'PingFang TC', 'Microsoft JhengHei', monospace" text-anchor="middle" letter-spacing="0.06em">轉發</text>

