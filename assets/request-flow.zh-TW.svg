        <rect x="296" y="212" width="160" height="64" rx="6" fill="#f3f1e8"/>
        <rect x="296" y="212" width="160" height="64" rx="6" fill="#176b87" stroke="#176b87" stroke-width="1.4" fill-opacity="0.08"/>
        <rect x="304" y="218" width="48" height="12" rx="2" fill="#7fe0cf" stroke="#176b87" stroke-width="0.8"/>
