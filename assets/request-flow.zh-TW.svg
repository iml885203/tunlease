        <rect x="480" y="304" width="160" height="64" rx="6" fill="#f3f1e8"/>
        <rect x="480" y="304" width="160" height="64" rx="6" fill="#f3f1e8" stroke="#0b1715" stroke-width="1"/>
        <rect x="488" y="310" width="28" height="12" rx="2" fill="none" stroke="#0b1715" stroke-width="0.8" stroke-opacity="0.4"/>
        <text x="502" y="319" fill="#0b1715" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'PingFang TC', 'Microsoft JhengHei', monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.8">APP</text>
        <text x="560" y="340" fill="#0b1715" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', Helvetica, Arial, sans-serif" text-anchor="middle">原始 app</text>
        <text x="560" y="356" fill="#43534f" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'PingFang TC', 'Microsoft JhengHei', monospace" text-anchor="middle">fallback · fail-open</text>

        <!-- tul CLI (focal) -->
        <rect x="520" y="72" width="160" height="64" rx="6" fill="#f3f1e8"/>
        <rect x="520" y="72" width="160" height="64" rx="6" fill="#176b87" stroke="#176b87" stroke-width="1.4" fill-opacity="0.08"/>
        <rect x="528" y="78" width="48" height="12" rx="2" fill="#7fe0cf" stroke="#176b87" stroke-width="0.8"/>
        <text x="552" y="87" fill="#0b1715" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'PingFang TC', 'Microsoft JhengHei', monospace" text-anchor="middle" letter-spacing="0.08em">TUNLEASE</text>
        <text x="600" y="108" fill="#0b1715" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', Helvetica, Arial, sans-serif" text-anchor="middle">tul CLI</text>
        <text x="600" y="124" fill="#43534f" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'PingFang TC', 'Microsoft JhengHei', monospace" text-anchor="middle">維持 tunnel</text>

