        <rect x="40" y="212" width="168" height="64" rx="6" fill="#f3f1e8"/>
        <rect x="40" y="212" width="168" height="64" rx="6" fill="#f3f1e8" stroke="#0b1715" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="48" y="218" width="28" height="12" rx="2" fill="none" stroke="#0b1715" stroke-width="0.8" stroke-opacity="0.4"/>
        <text x="62" y="227" fill="#0b1715" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'PingFang TC', 'Microsoft JhengHei', monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.8">EXT</text>
        <text x="124" y="248" fill="#0b1715" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', Helvetica, Arial, sans-serif" text-anchor="middle">第三方</text>
        <text x="124" y="264" fill="#43534f" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'PingFang TC', 'Microsoft JhengHei', monospace" text-anchor="middle">例如 Stripe webhook</text>

