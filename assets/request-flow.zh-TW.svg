        <text x="148" y="448" fill="#0b1715" font-size="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', Helvetica, Arial, sans-serif">Tunlease 元件</text>

        <rect x="280" y="438" width="20" height="14" rx="3" fill="#f3f1e8" stroke="#0b1715" stroke-width="1"/>
        <text x="308" y="448" fill="#0b1715" font-size="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', Helvetica, Arial, sans-serif">既有服務</text>

        <line x1="420" y1="445" x2="448" y2="445" stroke="#176b87" stroke-width="1.6" marker-end="url(#tunlease-flow-readme-zh-arrow-accent)"/>
