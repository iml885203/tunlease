<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tunlease-flow-title tunlease-flow-desc" id="tunlease-flow-readme-zh-root">
        <title id="tunlease-flow-title">一個固定 URL，依 path 分流</title>
        <desc id="tunlease-flow-desc">第三方呼叫 tunlease gateway 的固定 URL；已認領的 path 經由開發者的 tul CLI tunnel 到本機服務，其他 path 回到原始 app。</desc>
        <defs>
      <style>#tunlease-flow-readme-zh-root { --color-paper:  #f3f1e8;
      --color-ink:    #0b1715;
      --color-muted:  #43534f;
      --color-accent: #176b87;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace; }
      #tunlease-flow-readme-zh-root { font-family: var(--font-sans); color: var(--color-ink); }
      #tunlease-flow-readme-zh-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#tunlease-flow-readme-zh-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="tunlease-flow-readme-zh-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#43534f"/></marker>
          <marker id="tunlease-flow-readme-zh-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#176b87"/></marker>
          <marker id="tunlease-flow-readme-zh-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#176b87"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f3f1e8"/>

        <!-- Zones -->
        <rect x="496" y="40" width="448" height="120" rx="8" fill="#0b1715" stroke="#0b1715" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.14"/>
        <rect x="516" y="44" width="56" height="12" rx="2" fill="#f3f1e8"/>
        <text x="544" y="53" fill="#43534f" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'PingFang TC', 'Microsoft JhengHei', monospace" text-anchor="middle" letter-spacing="0.14em">開發者電腦</text>

        <rect x="272" y="180" width="432" height="212" rx="8" fill="#0b1715" stroke="#0b1715" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.14"/>
        <rect x="292" y="184" width="48" height="12" rx="2" fill="#f3f1e8"/>
        <text x="316" y="193" fill="#43534f" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'PingFang TC', 'Microsoft JhengHei', monospace" text-anchor="middle" letter-spacing="0.14em">共用環境</text>

        <!-- Callout -->
        <text x="40" y="96" fill="#43534f" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', Helvetica, Arial, sans-serif">CLI 主動以 WebSocket 連出，</text>
        <text x="40" y="116" fill="#43534f" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', Helvetica, Arial, sans-serif">本機不需開放 inbound port。</text>

