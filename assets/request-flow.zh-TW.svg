        <text x="376" y="248" fill="#0b1715" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', Helvetica, Arial, sans-serif" text-anchor="middle">Gateway</text>
        <text x="376" y="264" fill="#43534f" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'PingFang TC', 'Microsoft JhengHei', monospace" text-anchor="middle">依 path 分流</text>

