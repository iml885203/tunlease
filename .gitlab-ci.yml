# Self-contained GitLab CI pipeline. It uses only public images and the built-in
# GitLab Container Registry, so it runs on any GitLab instance with a Docker
# executor — no external CI templates or private infrastructure required.
#
# The canonical open-source pipeline lives in .github/workflows/ci.yml; this file
# mirrors it for GitLab users. Point the image build at your own registry by
# overriding the TARGET_REGISTRY / login variables below.

stages:
  - test
  - build
  - release

variables:
  IMAGE_NAME: tunlease-gateway

test:
  stage: test
  image: golang:1.26
  script:
    - go vet ./...
    - go build ./...
    - go test -race ./...

lint:
  stage: test
  image: golangci/golangci-lint:v2.12.2-alpine
  script:
    - golangci-lint run ./...

# Build is decoupled from push. This repo's Dockerfile is the single build
# definition; the job below just selects the gateway target to build and WHICH
# registry to push to. Multi-arch (amd64+arm64) so images run on either
# node type; Go cross-compiles natively via the Dockerfile's TARGETOS/TARGETARCH.
# Multi-arch manifests can't be --load'd, so we build --push directly.
#
# Defaults target the built-in GitLab Container Registry ($CI_REGISTRY*). To push
# elsewhere, set TARGET_REGISTRY + REGISTRY_HOST/USER/PASSWORD to your registry.
build-images:
  stage: build
  needs: []
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    TAG: "$CI_COMMIT_SHORT_SHA"
    TARGET_REGISTRY: "$CI_REGISTRY_IMAGE"
    REGISTRY_HOST: "$CI_REGISTRY"
    REGISTRY_USER: "$CI_REGISTRY_USER"
    REGISTRY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  parallel:
    matrix:
      - IMAGE_TARGET: gateway
        IMAGE_NAME: tunlease-gateway
  before_script:
    - echo "$REGISTRY_PASSWORD" | docker login -u "$REGISTRY_USER" --password-stdin "$REGISTRY_HOST"
  script:
    - docker buildx create --use --name tunlease-builder
    - |
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --target "$IMAGE_TARGET" \
        --push \
        -t "$TARGET_REGISTRY/$IMAGE_NAME:$TAG" \
        .
    - echo "Pushed multi-arch $IMAGE_NAME:$TAG to $TARGET_REGISTRY"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_TAG'

# Cross-compile the CLI for every supported platform and, on a tag, upload the
# binaries + checksums to the project's generic package registry.
release-cli:
  stage: release
  image: golang:1.26
  needs: [test, lint]
  script:
    - apt-get update -qq && apt-get install -y -qq curl
    - VERSION="${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"
    - BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
    - |
      for PAIR in "linux/amd64" "linux/arm64" "darwin/amd64" "darwin/arm64" "windows/amd64"; do
        OS=${PAIR%/*}; ARCH=${PAIR#*/}; NAME="tunlease-${OS}-${ARCH}"
        [ "$OS" = "windows" ] && NAME="${NAME}.exe"
        GOOS=$OS GOARCH=$ARCH CGO_ENABLED=0 go build \
          -ldflags "-s -w -X 'main.version=${VERSION}' -X 'main.buildTime=${BUILD_TIME}'" \
          -o "$NAME" ./cmd/tunlease
        sha256sum "$NAME" > "${NAME}.sha256"
      done
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        for FILE in tunlease-*; do
          URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/tunlease/${CI_COMMIT_TAG}/${FILE}"
          curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$FILE" "$URL"
        done
      fi
  artifacts:
    paths:
      - tunlease-linux-*
      - tunlease-darwin-*
      - tunlease-windows-*
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_TAG'
