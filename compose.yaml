services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 20

  gateway:
    build:
      context: .
      target: gateway
    command: ["gateway", "--config", "/etc/tunlease/config.yaml"]
    volumes:
      - ./testdata/compose/gateway.yaml:/etc/tunlease/config.yaml:ro
    ports:
      - "18300:8300"
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started

  # The fail-open app the gateway proxies unclaimed paths to. The gateway itself
  # fronts the app (fail_open_url in the gateway config) and does the path demux.
  app:
    build:
      context: .
      target: testapp
