image:
  repository: ghcr.io/iml885203/tunlease-gateway
  tag: v1.3.0
  pullPolicy: IfNotPresent

service:
  port: 80

ingress:
  enabled: true
  className: nginx
  # Use the existing fixed callback host. The gateway must receive the whole
  # host so it can route claimed paths and proxy every other path to failOpenURL.
  host: callbacks.staging.example.com
  path: /
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "14400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "14400"

config:
  listen: ":8300"
  # Close a dispatched tunnel request after this long without any reads or
  # writes. Activity extends the deadline; this does not limit total duration.
  tunnelIdleTimeout: "4h"
  # Required origin for every request without a connected matching tunnel.
  # Replace this example with the original app's cluster-internal URL.
  failOpenURL: http://callback-app.default.svc
  # Public relays without an original app may clear failOpenURL and return an
  # error status for unclaimed requests instead (for example, 404).
  unclaimedStatus: 0
  # Hide claim metadata while retaining release by an already-known claim ID.
  disableClaimList: false
  maxClaims: 64
  # Optional safety limits. Zero keeps the existing unlimited behavior.
  maxClaimsPerOwner: 0
  maxClaimDuration: "0s"
  minClaimPathSegments: 0
  # Accept a stable client-generated bearer secret and isolate list/release by
  # its hashed owner. The CLI creates this identity automatically.
  dynamicClientIdentity: false
  # Path allowlist (opt-in): an empty list allows any path. The prefixes below
  # are an example — set the ones that cover your callbacks, or clear the list
  # on a trusted network. Restricting it stops anyone claiming paths like /admin.
  whitelist:
    - /webhooks/
    - /integration/

# Client authentication is disabled when tokens is empty. Configure tokens for
# any gateway reachable outside a trusted development network.
auth:
  tokens: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
