image:
  repository: ghcr.io/iml885203/tunlease-gateway
  tag: v0.1.0
  pullPolicy: IfNotPresent

service:
  port: 80

ingress:
  enabled: true
  className: nginx
  # Use the existing fixed callback host. The gateway must receive the whole
  # host so it can route claimed paths and proxy every other path to failOpenURL.
  host: callbacks.staging.example.com
  path: /
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

config:
  listen: ":8300"
  # Required origin for every request without a connected matching tunnel.
  # Replace this example with the original app's cluster-internal URL.
  failOpenURL: http://callback-app.default.svc
  maxClaims: 64
  # Path allowlist (opt-in): an empty list allows any path. The prefixes below
  # are an example — set the ones that cover your callbacks, or clear the list
  # on a trusted network. Restricting it stops anyone claiming paths like /admin.
  whitelist:
    - /webhooks/
    - /integration/

# Client authentication is disabled when tokens is empty. Configure tokens for
# any gateway reachable outside a trusted development network.
auth:
  tokens: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
