replicaCount: 1

image:
  repository: your-registry.example.com/tunlease-gateway
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 80

ingress:
  enabled: true
  className: nginx
  # Use the existing fixed callback host. The gateway must receive the whole
  # host so it can route claimed paths and proxy every other path to failOpenURL.
  host: callbacks.staging.example.com
  path: /
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

config:
  listen: ":8300"
  registry: memory
  redisURL: ""
  redisPrefix: tunlease
  # Same-domain deployment: the control plane is served under controlPrefix and
  # every other path is third-party traffic — tunnelled if a claim matches, else
  # proxied to failOpenURL (the original app), else 404. Set failOpenURL to your
  # app's Service, e.g. http://myapp.default.svc.cluster.local.
  controlPrefix: /_tunlease
  failOpenURL: ""
  maxClaims: 64
  ttlSeconds: 300
  heartbeatSeconds: 30
  # Path allowlist (opt-in): an empty list allows any path. The prefixes below
  # are an example — set the ones that cover your callbacks, or clear the list
  # on a trusted network. Restricting it stops anyone claiming paths like /admin.
  whitelist:
    - /webhooks/
    - /integration/

# Client authentication is disabled when tokens is empty. Configure tokens for
# any gateway reachable outside a trusted development network.
auth:
  tokens: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
