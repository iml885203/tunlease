apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tunlease.fullname" . }}-config
  labels:
    {{- include "tunlease.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    listen: {{ .Values.config.listen | quote }}
    tunnel_idle_timeout: {{ .Values.config.tunnelIdleTimeout | quote }}
    {{- if .Values.config.failOpenURL }}
    fail_open_url: {{ .Values.config.failOpenURL | quote }}
    {{- else }}
    unclaimed_status: {{ required "config.failOpenURL or config.unclaimedStatus is required" .Values.config.unclaimedStatus }}
    {{- end }}
    disable_claim_list: {{ .Values.config.disableClaimList }}
    max_claims: {{ .Values.config.maxClaims }}
    max_claims_per_owner: {{ .Values.config.maxClaimsPerOwner }}
    max_claim_duration: {{ .Values.config.maxClaimDuration | quote }}
    min_claim_path_segments: {{ .Values.config.minClaimPathSegments }}
    dynamic_client_identity: {{ .Values.config.dynamicClientIdentity }}
    whitelist:
      {{- toYaml .Values.config.whitelist | nindent 6 }}
    tokens: {{ toJson .Values.auth.tokens }}
