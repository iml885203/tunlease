apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tunlease.fullname" . }}-config
  labels:
    {{- include "tunlease.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    listen: {{ .Values.config.listen | quote }}
    advertise_host: ""
    registry: {{ .Values.config.registry | quote }}
    redis_url: {{ .Values.config.redisURL | quote }}
    redis_prefix: {{ .Values.config.redisPrefix | quote }}
    sidecar_token: {{ required "auth.sidecarToken is required" .Values.auth.sidecarToken | quote }}
    port_pool:
      start: {{ .Values.config.portPool.start }}
      end: {{ .Values.config.portPool.end }}
    ttl_seconds: {{ .Values.config.ttlSeconds }}
    heartbeat_seconds: {{ .Values.config.heartbeatSeconds }}
    whitelist:
      {{- toYaml .Values.config.whitelist | nindent 6 }}
    tokens: {{ toJson .Values.auth.tokens }}
