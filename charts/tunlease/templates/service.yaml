apiVersion: v1
kind: Service
metadata:
  name: {{ include "tunlease.fullname" . }}
  labels:
    {{- include "tunlease.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "tunlease.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
