version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - prealloc
    - revive

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - hugeParam
    errorlint:
      errorf: true
      errorf-multi: true
      asserts: true
      comparison: true
    revive:
      rules:
        - name: modifies-parameter

  exclusions:
    rules:
      - path: "_test\\.go"
        linters:
          - errcheck

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 50
  max-same-issues: 5

run:
  timeout: 5m
